    "matplotlib (>=3.10.7,<4.0.0)",
    "netcdf4 (>=1.7.3,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "xarray (>=2025.10.1,<2026.0.0)",
    "xgboost (>=3.1.1,<4.0.0)",
    "cfgrib (>=0.9.15.1,<0.10.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "basemap (>=2.0.0,<3.0.0)",
    "google-cloud-storage (>=3.6.0,<4.0.0)",
    "owslib (>=0.35.0,<0.36.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "mapclassify (>=2.10.0,<3.0.0)",
    "geocube (>=0.7.1,<0.8.0)",
    "optuna (>=4.7.0,<5.0.0)",
    "optuna-integration (>=4.7.0,<5.0.0)",
    "dask (>=2026.1.2,<2027.0.0)",
    "zarr (>=3.1.5,<4.0.0)",
    "optuna-dashboard (>=0.20.0,<0.21.0)",
